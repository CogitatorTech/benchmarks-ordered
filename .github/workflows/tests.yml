name: Run Tests

on:
  workflow_dispatch:
  schedule: # Run every day at midnight (UTC)
    - cron: '0 0 * * *'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
  push:
    branches:
      - develop
    paths-ignore:
      - '**.md'
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Build and check every implementation
        run: nix develop --command make test

      - name: Check formatting
        run: nix develop --command make lint

      - name: Collect the results
        run: nix develop --command make smoke
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: results/
