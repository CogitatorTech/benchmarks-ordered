name: Run Benchmarks and Publish Results

on:
  workflow_dispatch:
    inputs:
      sizes:
        description: 'Dataset sizes (comma-separated integers)'
        required: false
        default: '1000,100000'
        type: string
      samples:
        description: 'Measurement samples per fork'
        required: false
        default: '3'
        type: string
      forks:
        description: 'Measurement forks'
        required: false
        default: '1'
        type: string
      warmups:
        description: 'Warmup count (leave blank for runner defaults)'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '0 3 * * 0'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/tests.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build benchmark runners
        run: nix develop --command make build

      - name: Run benchmarks
        run: |
          SIZES="${{ inputs.sizes || '1000,100000' }}"
          SAMPLES="${{ inputs.samples || '3' }}"
          FORKS="${{ inputs.forks || '1' }}"
          WARMUPS="${{ inputs.warmups }}"
          EXTRA_ARGS=""
          if [ -n "$WARMUPS" ]; then
            EXTRA_ARGS="--warmups $WARMUPS"
          fi
          nix develop --command python3 scripts/bench.py bench --sizes "$SIZES" --samples "$SAMPLES" --forks "$FORKS" $EXTRA_ARGS

      - name: Build GitHub Pages site
        run: nix develop --command make site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Upload raw benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results/

  deploy:
    needs: benchmark
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
